---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: fedora-mango-dms
description: This is my personal OS image.

base-image: ghcr.io/ublue-os/bluefin-dx
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      files:
        - netbird.repo
        - terra.repo
      copr:
        - duxlabs/dms
        #- kaleedtc/mangowm
        - sdegler/hyprland
        - peterwu/rendezvous
    install:
      packages:
        - dms
        - dux-greeter
        - mangowm
        - quickshell
        - hypridle
        - matugen
        - qt6ct
        - dgop
        - kitty
        - atuin
        - neovim
        - wlr-randr
        - xdg-desktop-portal-wlr
        - ripgrep
        - mpv
        - yt-dlp
        - brightnessctl
        - zoxide
        - nmap
        - hugo
        - eza
        - simple-scan
        - udiskie
        - nano
        - bibata-cursor-themes

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - org.gnome.Loupe
          - dev.zed.Zed
          - com.valvesoftware.Steam
          - io.github.flattool.Warehouse
          - org.chromium.Chromium
          - com.github.tchx84.Flatseal
          - com.ranfdev.DistroShelf
          - md.obsidian.Obsidian
      - scope: user

  - type: script
    snippets:
      - "dnf install -y --setopt=tsflags=noscripts netbird netbird-ui"

  - type: systemd
    system:
      disabled:
        - gdm.service
      enabled:
        - netbird.service
        - greetd.service

  - type: signing
