general {
    lock_cmd = dms ipc call lock lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = wlopm --on '*'
}

listener {
  on-timeout=loginctl lock-session
  timeout=900
}

listener {
  on-timeout = wlopm --off '*'
  on-resume = wlopm --on '*'
  timeout=905
}

listener {
  on-timeout=systemctl suspend
  timeout=1200
}
