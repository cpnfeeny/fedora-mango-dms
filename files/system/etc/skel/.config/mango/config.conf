# --- MONITORS ---
# Format: monitor=name, resolution@refresh, position, scale
monitor_rule=name:.*,scale:1

# --- INPUT & TOUCHPAD ---
xkb_rules_layout=us,us
xkb_rules_variant=dvorak-intl,
xkb_rules_options=caps:super,grp:win_space_toggle

repeat_rate=25
repeat_delay=600
sloppy_focus=1
focus_on_activate=1
trackpad_scroll_method=1
trackpad_natural_scrolling=1
trackpad_click_method=2
tap_to_click=1

# --- LOOK AND FEEL / LAYOUT ---
gap_inner_horizontal=4
gap_outer_vertical=4
border_px=2
border_radius=12
cursor_size=32
cursor_theme=phinger-cursors-light
focus_color=0xa3be8cff

#scratchpad
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.85

# Master-stack layout configuration
new_is_master=0
#default_nmaster=1
default_master_factor=0.65

# --- ANIMATIONS & EFFECTS ---
animations=1
animation_curve_open=0.05,0.9,0.1,1.05
animation_duration_open=300

# --- WINDOW RULES ---
# Syntax: windowrule=rule_type:value,appid:pattern
window_rule=is_floating:1,app_id:Rofi
window_rule=is_floating:1,app_id:floating
window_rule=is_floating:1,app_id:org.quickshell
idle_inhibit_when_fullscreen=1

# Scratchpad rule for Obsidian
window_rule=is_named_scratchpad:1,width:1536,height:960,app_id:md.obsidian.Obsidian
bind=SUPER,O,toggle_named_scratchpad,md.obsidian.Obsidian,none,obsidian

# --- KEYBINDINGS ---
# Syntax: bind=MODIFIERS,KEY,ACTION,ARGS

# Terminal & Session
bind=SUPER+SHIFT,Return,spawn,kitty
bind=SUPER,X,killclient
bind=SUPER,Q,quit
bind=SUPER,E,togglefullscreen
bind=SUPER,F,togglefloating
bind=SUPER+SHIFT,R,reload_config

# Screenshots
bind=SUPER+SHIFT,S,spawn,dms screenshot
bind=CTRL,Print,spawn,dms screenshot full
bind=ALT,Print,spawn,dms screenshot window

# DMS IPC Launchers
bind=SUPER,P,spawn,dms ipc call spotlight toggle
bind=SUPER,C,spawn,dms ipc call clipboard toggle
bind=SUPER,M,spawn,dms ipc call processlist focusOrToggle
bind=SUPER,comma,spawn,dms ipc call settings focusOrToggle
bind=SUPER,G,spawn,dms ipc call notifications toggle
bind=SUPER,Y,spawn,dms ipc call dankdash wallpaper
bind=SUPER,Tab,spawn,dms ipc call hypr toggleOverview
bind=SUPER+SHIFT,X,spawn,dms ipc call powermenu toggle
bind=SUPER+SHIFT,slash,spawn,dms ipc call keybinds toggle hyprland

# Master Layout Controls
bind=SUPER,Return,zoom
bind=SUPER,N,focusstack,next
bind=SUPER,T,focusstack,prev

# Workspaces (Tags 1-10)
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER,0,view,10

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9
bind=SUPER+SHIFT,0,tag,10

# Media & Hardware Keys
bind=NONE,XF86AudioRaiseVolume,spawn,dms ipc call audio increment 3
bind=NONE,XF86AudioLowerVolume,spawn,dms ipc call audio decrement 3
bind=NONE,XF86AudioMute,spawn,dms ipc call audio mute
bind=NONE,XF86MonBrightnessUp,spawn,dms ipc call brightness increment 5 ""
bind=NONE,XF86MonBrightnessDown,spawn,dms ipc call brightness decrement 5 ""

# Session Lock
bind=SUPER+ALT,L,spawn,dms ipc call lock lock

# Mouse Binds
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

#Resize windows
bind=SUPER,S,resizewin,50 0
bind=SUPER,H,resizewin,-50 0

# Lock and idle
switchbind=fold,spawn,loginctl lock-session && sleep 0.3 && wlr-dpms off
switchbind=unfold,spawn,wlr-dpms on

# --- AUTOSTART ---
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=wlroots
exec-once = systemctl --user restart xdg-desktop-portal-wlr xdg-desktop-portal
exec-once = dms run
#exec_once=~/.config/mango/autostart

# Add to the end of ~/.config/mango/config.conf
#source=~/.config/mango/dms/colors.conf
#source=~/.config/mango/dms/layout.conf
#source=~/.config/mango/dms/outputs.conf


